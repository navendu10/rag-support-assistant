# Appended to a tagged prompt when the output guard rejected the answer (one regeneration).
guard_retry_note: |


  Your previous answer was rejected by a fact check: {problems}
  Answer again. State numbers, amounts, time limits and promises only if a trust="store"
  source states them, or, for a seller's own product facts, a trust="third_party" source
  with the seller named in the same sentence. VoltCart's own policies (returns, refunds,
  credits, discounts, VoltCart's warranty) must come from a trust="store" source. If the
  store sources don't answer the question, set "found_in_sources" to false.

# Base configuration shared by every session. Secrets live in .env, never here.
# Any value can be overridden with an environment variable using "__" for nesting,
# e.g. LLM__SMALL_MODEL=openai/gpt-oss-20b

weaviate:
  url: http://localhost:8080
  grpc_port: 50051

embedding:
  model_name: BAAI/bge-small-en-v1.5
  dimension: 384

llm:
  # Small, fast model for routing, query rewriting and cheap checks.
  small_model: openai/gpt-oss-20b
  # Larger model for final answers and agent tool calling.
  large_model: openai/gpt-oss-120b
  temperature: 0.0
  timeout_seconds: 30
  # gpt-oss models think before answering; "low" roughly halves token use.
  # Keep this fixed across stages so comparisons stay fair.
  reasoning_effort: low
  max_completion_tokens: 2048

# Client-side throttling per model. Groq free tier (checked 2026-10-20):
# 30 requests/min, 8,000 tokens/min, 1,000 requests/day, 200K tokens/day.
rate_limit:
  requests_per_minute: 25
  tokens_per_minute: 7000
  expected_output_tokens: 500   # reserved per request before the real usage is known
  max_retries: 6
  backoff_base_seconds: 2
  backoff_max_seconds: 60
  max_retry_after_seconds: 120  # longer waits mean the daily quota is spent: stop

cache:
  enabled: true
  path: .cache/llm_cache.sqlite

paths:
  generated_dir: data/generated
  golden_file: data/golden/questions.jsonl
  users_file: data/users.json
  results_dir: results

eval:
  recall_k: 5

# Query rewriting (Session 6). The rewriter uses llm.small_model.
query:
  history_turns: 6   # latest chat turns shown to the rewriter
  max_attempts: 2    # one call plus one retry on invalid output, then fall back to the raw message

# Grounded generation (Session 8). Uses llm.large_model with structured output.
grounding:
  max_attempts: 2    # one call plus one retry on invalid output, then "not found"

# Human handoff (Session 8, v6). Customer tickets are appended here (git-ignored).
handoff:
  tickets_path: data/tickets/tickets.jsonl

# Prompt-injection defences (Session 9, v7). See docs/security.md and ADR 0007.
injection:
  # Layer 1: instruction-like phrases flagged at ingestion (regex, case-insensitive).
  # Flagged third-party chunks are dropped; flagged store chunks are only logged.
  patterns:
    - '\b(assistant|system|chatbot)\s*:'
    - '\bignore\s+(all\s+)?(previous|prior|above|your|the)\s+(instructions|rules|prompts?)'
    - '\b(disregard|forget)\s+(all\s+)?(previous|prior|your)\s+(instructions|rules)'
    - '\btell\s+(the\s+)?customers?\b'
    - '\bnote\s+to\s+(the\s+)?(ai|assistant|bot|chatbot)s?\b'
    - '\b(ai|assistant|bot)s?\s+(must|should)\s+(always\s+)?(say|tell|answer|reply)'
    - '\bdeveloper\s+mode\b'
    - '\byou\s+are\s+now\b'
  # Layer 3: promises allowed only when a cited STORE source contains them.
  claim_phrases:
    - lifetime warranty
    - lifetime guarantee
    - guaranteed forever
    - warranty for life
    - free replacement for life
    - never expires
  # A sentence naming one of these attributes its facts to the seller (layer 3, option B).
  attribution_terms: [seller, sold by, the listing says, according to the listing]
  # A sentence about one of these states VoltCart's own policy: it always needs a STORE
  # source, even when attributed to a seller.
  voltcart_policy_terms:
    - return
    - refund
    - credit
    - discount
    - restocking
    - voltcart warranty
    - our warranty
    - voltcart guarantee
  max_generations: 3   # answer generations per question, across every retry

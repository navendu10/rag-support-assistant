# Stage v4a: v3 plus query rewriting with chat history (Session 6).
# The small model rewrites the latest message, using the chat history and the product
# catalogue, into a standalone question (for the reranker and the answer) and a
# keyword-rich search query (for hybrid search). It never decides region or audience.
# Measured on its own, before v4 adds the region filter.
name: v4a
description: v3 + query rewriting with chat history
chunking: structure
chunk_size: 1200
chunk_overlap: 150
min_chunk_chars: 200
index: Chunks_v2         # rewriting doesn't change ingestion: reuse v2's collection
search: hybrid
hybrid:
  alpha_strategy: dynamic
  code_alpha: 0.25
  default_alpha: 1.0
  fusion: relative_score
  query_properties: [text, title, product_code^2]
rerank: true
rerank_model: Xenova/ms-marco-MiniLM-L-6-v2
fetch_k: 20
min_score: null          # Session 8
rerank_fusion: blend
rerank_blend_weight: 0.5
query_rewrite: true      # v3: false
use_history: true        # v3: false
region_filter: false     # v4 turns it on
access_control: false    # Session 7 (v5)
grounding: false         # Session 8
injection_guard: false   # Session 9
top_k: 4

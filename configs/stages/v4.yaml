# Stage v4: v4a plus a region filter (Session 6).
# Customers search only documents for their own region or ALL, taken from their profile
# in data/users.json, never from the question. Agents (region ALL) are not filtered.
# The filter runs inside the Weaviate hybrid query, before ranking.
# This is personalisation, not security: access control arrives in Session 7.
name: v4
description: v4a + region filter from the user profile
chunking: structure
chunk_size: 1200
chunk_overlap: 150
min_chunk_chars: 200
index: Chunks_v2
search: hybrid
hybrid:
  alpha_strategy: dynamic
  code_alpha: 0.25
  default_alpha: 1.0
  fusion: relative_score
  query_properties: [text, title, product_code^2]
rerank: true
rerank_model: Xenova/ms-marco-MiniLM-L-6-v2
fetch_k: 20
min_score: null          # Session 8
rerank_fusion: blend
rerank_blend_weight: 0.5
query_rewrite: true
use_history: true
region_filter: true      # v4a: false
access_control: false    # Session 7 (v5)
grounding: false         # Session 8
injection_guard: false   # Session 9
top_k: 4

# Local Weaviate for development. Vectors are computed in Python (FastEmbed),
# so no vectorizer modules are enabled. API-key auth arrives in Session 7.
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.1
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      # Keep Go's heap below the container limit so Weaviate frees memory before the OOM killer acts.
      GOMEMLIMIT: 900MiB
    volumes:
      - weaviate_data:/var/lib/weaviate
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  weaviate_data:

# Local Weaviate for development. Vectors are computed in Python (FastEmbed),
# so no vectorizer modules are enabled.
# Session 7: anonymous access is off. Every request needs an API key, and role-based
# access control (RBAC) decides what each key may read. The one static user, "admin", gets
# its key from .env (WEAVIATE_ADMIN_KEY; create it with
# `python scripts/setup_access.py --init-admin-key`). The customer and agent keys are
# database users created at runtime by scripts/setup_access.py. See docs/security.md.
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.1
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_ADMIN_KEY:?Set WEAVIATE_ADMIN_KEY in .env (python scripts/setup_access.py --init-admin-key)}
      AUTHENTICATION_APIKEY_USERS: admin
      AUTHENTICATION_DB_USERS_ENABLED: "true"
      AUTHORIZATION_RBAC_ENABLED: "true"
      AUTHORIZATION_RBAC_ROOT_USERS: admin
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      # Keep Go's heap below the container limit so Weaviate frees memory before the OOM killer acts.
      GOMEMLIMIT: 900MiB
    volumes:
      - weaviate_data:/var/lib/weaviate
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  weaviate_data:

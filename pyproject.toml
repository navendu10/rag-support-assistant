[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_assistant"
version = "0.5.0"
description = "RAG customer-support assistant for a fictional electronics retailer, built to reproduce and fix classic RAG failures."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Navendu Vyas" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "data", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rag_assistant", "generators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "data"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs Weaviate and/or Groq (deselect with -m 'not integration')",
]
